<main>
  <div class="container-login row w-100 mt-5 mb-5">
    <section class="col-xl-7 col-md-7 col-sm-12 col-12 mb-3 mt-5 section-form">

    <mat-card class="login-card">


      <form action="form" [formGroup]="form">

          <h2 class="mb-3">Bem-vindo de volta!</h2>

            <h6 class="mt-3 mb-4">Digite seus dados de acesso</h6>

                <mat-form-field class="col-12 w-100 mb-3" appearance="outline">
                    <mat-label>Email</mat-label>
                    <input
                    matInput
                    type="email"
                    name="email"
                    placeholder="pat@example.com"
                    formControlName="login"
                    pattern="^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$"
                    required>
                    <mat-error *ngIf="F_login.invalid">{{getErrorMessageLogin()}}</mat-error>
                </mat-form-field>

                <mat-form-field class="col-12 w-100" appearance="outline">
                    <mat-label>Senha</mat-label>
                    <input
                    matInput
                    [type]="hidePassword() ? 'password' : 'text'"
                     formControlName="password"
                     minlength="6"
                     required>
                    <button
                    mat-icon-button
                    matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hidePassword()"
                  >
                    <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
                  </button>
                    <mat-error *ngIf="F_password.invalid">{{getErrorMessagePassword()}}</mat-error>
                </mat-form-field>


        </form>
        @if(loading()) {
          <div class="loading-container flex-content-center">
          <div class="loading col-12 w-100">
            <mat-progress-spinner
          class="col-12"
            [diameter]="20"
            mode="indeterminate">
          </mat-progress-spinner><br>
            <h6>Entrando<span class="one me-1">.</span><span class="two me-1">.</span><span class="three me-1">.</span></h6>
          </div>
        </div>
        }

        <div class="col-xl-5 col-md-12 col-10 p-1 w-100 btn-container">
            <button type="button" (click)="onSubmit()" class="w-100 btn-confirm">Entrar</button>
            <button type="button" class="w-100 btn-google mt-2 mb-2">
                <img class="google" src="\assets\images\google.png" alt="google logo">
                Entrar com google
            </button>
        </div>

        <ul class="link-password">
            <li>
                <a href="">Esqueci minha senha</a>
            </li>
        </ul>

        <div class="w-100"></div>


    </mat-card>

    </section>

    <section class="col-xl-5 col-md-5 col-sm-12 col-12 mb-3 mt-5 text-login">

      <div class="img-container">
        <img (click)="goTo('dashboard/company-search')" src="assets/images/Ficus_Logo.png" alt="">
      </div>
      <mat-card class="text-area">
      <!-- <div class="data-bank-img">
        <img src="./../../../../assets/images/chip-1710300_1280.png" alt="">
      </div> -->
        <div class="w-100 register-info">
          <h5>Ainda não tem cadastro?</h5>
          <!-- <p class="f-600">Faça parte da maior plataforma de leads do Brasil!</p> -->
          <div class="col-xl-5 col-md-12 col-10 p-1 w-100 btn-container mt-3">
              <button (click)="goTo('create-account')" type="button" class="btn-account f-550">Criar conta</button>
          </div>
        </div>
        </mat-card>

   </section>
  </div>
</main>
